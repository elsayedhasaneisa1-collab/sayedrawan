function getRandomNonRepeat(key, list){
  let used = JSON.parse(localStorage.getItem(key)||'[]');
  if(used.length >= list.length) used=[];
  let available = list.filter(x=>!used.includes(x));
  if(available.length===0){ available=list; used=[]; }
  const pick = available[Math.floor(Math.random()*available.length)];
  used.push(pick);
  localStorage.setItem(key, JSON.stringify(used));
  return pick;
}

function checkXOWinner(){
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(let w of wins){ const [a,b,c]=w; if(xoBoard[a] && xoBoard[a]===xoBoard[b] && xoBoard[a]===xoBoard[c]){ document.getElementById('xoWinner').classList.remove('hidden'); document.getElementById('xoWinner').textContent=`${xoBoard[a]} كسب! 🎉 ${xoBoard[a]===xoMySymbol?'مبروك يا '+currentUser+'!':'هارد لك'}`; if(channel) channel.send({type:'broadcast',event:'xo_win',payload:{winner:xoBoard[a]}}); return xoBoard[a]; } }
  if(xoBoard.every(v=>v)){ document.getElementById('xoWinner').classList.remove('hidden'); document.getElementById('xoWinner').textContent='تعادل! 🤝'; return 'draw'; }
  return null;
}
window.playXO=(i)=>{
  if(xoBoard[i]) return;
  if(xoTurnSymbol!==xoMySymbol && xoMySymbol!==null) { alert('مش دورك، استنى روان!'); return; }
  xoBoard[i]=xoTurnSymbol;
  xoTurnSymbol = xoTurnSymbol==='X'?'O':'X';
  drawXO();
  if(channel) channel.send({type:'broadcast',event:'xo',payload:{board:xoBoard, turn:xoTurnSymbol}});
};
window.resetXO=()=>{
  xoBoard=["","","","","","","","",""];
  xoTurnSymbol='X';
  xoMySymbol = currentUser==='السيد'?'X':'O';
  document.getElementById('xoWinner').classList.add('hidden');
  drawXO();
  if(channel) channel.send({type:'broadcast',event:'xo_reset',payload:{board:xoBoard, turn:xoTurnSymbol}});
};
window.inviteXO=()=>{

};

// CLEAR CHAT FROM DB
window.clearChatDB=async()=>{
  if(!confirm('⚠️ هتمسح كل الشات من قاعدة البيانات نهائياً عندك وعند روان؟')) return;
  const pass=prompt('اكتب كلمة السر للتأكيد:');
  if((currentUser==='السيد' && pass!=='sayed123') || (currentUser==='روان' && pass!=='rawan123')){ alert('كلمة السر غلط'); return; }
  const {error}=await supabaseClient.from('messages').delete().neq('id','00000000-0000-0000-0000-000000000000');
  if(error){ alert('خطأ: '+error.message); } else { messages=[]; renderMsgs(); alert('تم مسح الشات من قاعدة البيانات ✅'); }
};

// VOICE
let recTimerInt;
async function toggleRecord(){
  if(isRecording){ stopRecording(true); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[]; mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=async()=>{ clearInterval(recTimerInt); const blob=new Blob(audioChunks,{type:'audio/webm'}); if(blob.size>0 && window._shouldSendVoice){ await uploadVoice(blob); } stream.getTracks().forEach(t=>t.stop()); };
    mediaRecorder.start(); isRecording=true; window._shouldSendVoice=false;
    document.getElementById('recordingBar').classList.remove('hidden');
    let sec=0; recTimerInt=setInterval(()=>{ sec++; document.getElementById('recTimer').textContent=sec+'s'; },1000);
  }catch(e){ alert('الميكروفون مقفول في المتصفح'); }
}
window.stopRecording=(send)=>{ window._shouldSendVoice=send; if(mediaRecorder && isRecording){ mediaRecorder.stop(); } isRecording=false; document.getElementById('recordingBar').classList.add('hidden'); };
async function uploadVoice(blob){
  const fileName=`voice_${Date.now()}.webm`;
  const {data,error}=await supabaseClient.storage.from('chat-media').upload(fileName,blob);
  if(error){ alert('خطأ رفع الصوت: '+error.message); return; }
  const {data:pub}=supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
  await supabaseClient.from('messages').insert({sender:currentUser,type:'voice',audio_url:pub.publicUrl});
}

// IMAGE
async function handleImage(e){
  const file=e.target.files[0]; if(!file) return;
  if(file.size>5*1024*1024){ alert('الصورة كبيرة، اختار صورة أقل من 5 ميجا'); return; }
  const fileName=`img_${Date.now()}_${file.name}`;
  const {error}=await supabaseClient.storage.from('chat-media').upload(fileName,file);
  if(error){ alert('خطأ رفع الصورة: '+error.message); return; }
  const {data:pub}=supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
  await supabaseClient.from('messages').insert({sender:currentUser,type:'image',image_url:pub.publicUrl});
  e.target.value='';
}

// NOTIFICATIONS
window.enableNotify=async()=>{
  if(!('Notification' in window)){ alert('المتصفح لا يدعم الإشعارات'); return; }
  const perm=await Notification.requestPermission();
  document.getElementById('notifyStatus').textContent=perm==='granted'?'✅ الإشعارات شغالة':'❌ مرفوضة';
  if(perm==='granted'){ new Notification('السيد & روان ❤️',{body:'الإشعارات اشتغلت! هتوصلك رسائل روان حتى لو التطبيق مقفول'}); }
};
function notifyNewMessage(m){
  if(m.sender===currentUser) return;
  if(Notification.permission==='granted' && document.hidden){
    new Notification(m.sender+' 💬',{body:m.text|| (m.type==='image'?'📷 صورة':'🎤 فويس'), icon:'https://cdn-icons-png.flaticon.com/512/833/833472.png'});
  }
  // صوت اشعار
  try{ const a=new Audio('https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3?filename=notification-2-126507.mp3'); a.volume=0.5; a.play(); }catch(e){}
}

// CALL WEBRTC SIMPLE SIGNALING VIA SUPABASE BROADCAST
window.startCall=async()=>{
  document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callScreen').classList.add('flex');
  document.getElementById('callName').textContent=currentUser==='السيد'?'روان':'السيد';
  document.getElementById('callStatus').textContent='جاري الاتصال...';
  if(channel) channel.send({type:'broadcast',event:'call_invite',payload:{from:currentUser}});
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){ document.getElementById('callStatus').textContent='الميكروفون مقفول'; }
};
window.endCall=()=>{
  document.getElementById('callScreen').classList.add('hidden'); document.getElementById('callScreen').classList.remove('flex');
  document.getElementById('incomingCall').classList.add('hidden'); document.getElementById('incomingCall').classList.remove('flex');
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  if(channel) channel.send({type:'broadcast',event:'call_end',payload:{from:currentUser}});
};
window.toggleMute=()=>{
  if(localStream){ const t=localStream.getAudioTracks()[0]; if(t){ t.enabled=!t.enabled; document.getElementById('muteBtn').textContent=t.enabled?'🎤':'🔇'; } }
};
function showIncoming(from){
  document.getElementById('incomingCall').classList.remove('hidden'); document.getElementById('incomingCall').classList.add('flex');
  document.getElementById('incomingName').textContent=from+' يتصل... 📞';
  try{ const a=new Audio('https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=phone-ringing-101957.mp3'); a.loop=true; a.play(); window._ring=a; }catch(e){}
}
window.acceptCall=()=>{ if(window._ring){ window._ring.pause(); } document.getElementById('incomingCall').classList.add('hidden'); document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callScreen').classList.add('flex'); document.getElementById('callStatus').textContent='متصل ❤️'; };
window.declineCall=()=>{ if(window._ring){ window._ring.pause(); } document.getElementById('incomingCall').classList.add('hidden'); document.getElementById('incomingCall').classList.remove('flex'); if(channel) channel.send({type:'broadcast',event:'call_end',payload:{from:currentUser}}); };

async function init(){
 if(!currentUser){ login(); return; }
 const {data,error}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:true}).limit(300);
 if(error){ document.getElementById('app').innerHTML=`<div class="p-6 text-[11px]">خطأ DB: ${error.message}<br><br>شغل ملف supabase.sql الجديد</div>`; return; }
 messages=data||[]; main();
 channel=supabaseClient.channel('sayed-rawan-love-room', {config:{broadcast:{self:false}}});
 channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{ if(!messages.find(m=>m.id===p.new.id)){ messages.push(p.new); renderMsgs(); notifyNewMessage(p.new); } })
 .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},()=>{ messages=[]; renderMsgs(); })
 .on('broadcast',{event:'mood'},({payload})=>{ if(payload.user!==currentUser){ const bar=document.getElementById('partnerMoodBar'); if(bar) bar.textContent=`هي: ${payload.emoji} ${payload.label}`; } })
 .on('broadcast',{event:'xo'},({payload})=>{ xoBoard=payload.board; xoTurnSymbol=payload.turn; drawXO(); })
 .on('broadcast',{event:'xo_reset'},({payload})=>{ xoBoard=payload.board; xoTurnSymbol=payload.turn; document.getElementById('xoWinner')?.classList.add('hidden'); drawXO(); })
 .on('broadcast',{event:'xo_win'},({payload})=>{ const el=document.getElementById('xoWinner'); if(el){ el.classList.remove('hidden'); el.textContent=payload.winner+' كسب! 🎉'; } })
 .on('broadcast',{event:'xo_invite'},({payload})=>{ if(payload.from!==currentUser){ if(confirm(payload.from+' بيدعوك تلعب XO! تفتح اللعبة؟')){ openGames(); showGame('xo'); } } })
 .on('broadcast',{event:'call_invite'},({payload})=>{ if(payload.from!==currentUser) showIncoming(payload.from); })
 .on('broadcast',{event:'call_end'},()=>{ document.getElementById('callScreen').classList.add('hidden'); document.getElementById('incomingCall').classList.add('hidden'); if(window._ring) window._ring.pause(); })
 .subscribe();
 if(Notification.permission==='granted'){ document.getElementById('notifyStatus')?.textContent&& (document.getElementById('notifyStatus').textContent='✅ الإشعارات شغالة'); }
}
init();
</script>
