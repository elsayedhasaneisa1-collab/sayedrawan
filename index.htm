function getRandomNonRepeat(key, list){
  let used = JSON.parse(localStorage.getItem(key)||'[]');
  if(used.length >= list.length) used=[];
  let available = list.filter(x=>!used.includes(x));
  if(available.length===0){ available=list; used=[]; }
  const pick = available[Math.floor(Math.random()*available.length)];
  used.push(pick);
  localStorage.setItem(key, JSON.stringify(used));
  return pick;
}

function login(){
 document.getElementById('app').innerHTML=`<div class="h-[100dvh] flex flex-col items-center justify-center p-6"><div class="w-full max-w-[340px]"><div class="text-center"><div class="w-[70px] h-[70px] mx-auto glass rounded-[22px] flex items-center justify-center text-[28px]">❤️</div><h1 class="text-[28px] font-extrabold mt-4">السيد & روان</h1><p class="text-white/30 text-[11px] mt-1">عالمكم الخاص</p></div><div class="glass rounded-[28px] p-6 mt-7"><label class="text-[10px] font-bold text-white/40">اختر اسمك</label><select id="u" class="w-full mt-2 bg-white/[0.06] border border-white/10 rounded-[14px] px-4 py-4 text-[14px] outline-none"><option value="السيد">السيد 👑</option><option value="روان">روان 👸</option></select><input id="p" type="password" placeholder="كلمة السر" class="w-full mt-3 bg-white/[0.06] border border-white/10 rounded-[14px] px-4 py-4 text-[14px] outline-none"><button id="loginBtn" class="w-full mt-6 py-4 rounded-full bg-gradient-to-br from-[#ff2e93] to-[#7c3aed] font-extrabold text-[14px]">دخول ✨</button></div></div></div>`;

// XO - SYNCED
let xoMySymbol = null; let xoTurnSymbol = 'X';
function drawXO(){
  const b=document.getElementById('xoBoard'); if(!b) return;
  b.innerHTML=xoBoard.map((v,i)=>`<button onclick="playXO(${i})" class="aspect-square bg-white/[0.06] border border-white/10 rounded-[14px] flex items-center justify-center text-[22px] font-extrabold ${v==='X'?'text-pink-400':'text-violet-400'}">${v||''}</button>`).join('');
  const youEl=document.getElementById('xoYou'); if(youEl) youEl.textContent = xoMySymbol || (currentUser==='السيد'?'X':'O');
  const pEl=document.getElementById('xoPartner'); if(pEl) pEl.textContent = xoMySymbol ? (xoMySymbol==='X'?'O':'X') : (currentUser==='السيد'?'O':'X');
  const tEl=document.getElementById('xoTurn'); if(tEl) tEl.textContent = xoTurnSymbol===xoMySymbol ? 'دورك 🔥' : 'دور الطرف التاني ⏳';
  checkXOWinner();
}
function checkXOWinner(){
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(let w of wins){ const [a,b,c]=w; if(xoBoard[a] && xoBoard[a]===xoBoard[b] && xoBoard[a]===xoBoard[c]){ const el=document.getElementById('xoWinner'); if(el){ el.classList.remove('hidden'); el.textContent=`${xoBoard[a]} كسب! 🎉 ${xoBoard[a]===xoMySymbol?'مبروك!':'هارد لك'}`; } return xoBoard[a]; } }
  if(xoBoard.every(v=>v)){ const el=document.getElementById('xoWinner'); if(el){ el.classList.remove('hidden'); el.textContent='تعادل! 🤝'; } return 'draw'; } return null;
}
window.playXO=(i)=>{
  if(xoBoard[i]) return;
  if(xoMySymbol && xoTurnSymbol!==xoMySymbol){ alert('مش دورك!'); return; }
  xoBoard[i]=xoTurnSymbol; xoTurnSymbol = xoTurnSymbol==='X'?'O':'X'; drawXO();
  if(channel) channel.send({type:'broadcast',event:'xo',payload:{board:xoBoard, turn:xoTurnSymbol}});
};
window.resetXO=()=>{
  xoBoard=["","","","","","","","",""]; xoTurnSymbol='X'; xoMySymbol = currentUser==='السيد'?'X':'O';
  const w=document.getElementById('xoWinner'); if(w) w.classList.add('hidden'); drawXO();
  if(channel) channel.send({type:'broadcast',event:'xo_reset',payload:{board:xoBoard, turn:xoTurnSymbol}});
};

// VOICE - FIXED NO STORAGE NEEDED (base64 fallback)
let recTimerInt;
async function toggleRecord(){
  if(isRecording){ stopRecording(true); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[]; mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=async()=>{
      clearInterval(recTimerInt);
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      if(blob.size>0 && window._shouldSendVoice){ await uploadVoice(blob); }
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start(); isRecording=true; window._shouldSendVoice=false;
    document.getElementById('recordingBar').classList.remove('hidden');
    let sec=0; recTimerInt=setInterval(()=>{ sec++; const el=document.getElementById('recTimer'); if(el) el.textContent=sec+'s'; },1000);
    document.getElementById('voiceBtn').textContent='⏹️';
  }catch(e){ alert('الميكروفون مقفول، لازم تسمح للمتصفح'); }
}
window.stopRecording=(send)=>{ window._shouldSendVoice=send; if(mediaRecorder && isRecording){ mediaRecorder.stop(); } isRecording=false; const bar=document.getElementById('recordingBar'); if(bar) bar.classList.add('hidden'); document.getElementById('voiceBtn').textContent='🎤'; };
async function uploadVoice(blob){
  // حاول ترفع على storage، لو فشل احفظ كـ base64 في القاعدة
  try{
    const fileName=`voice_${Date.now()}.webm`;
    const {error}=await supabaseClient.storage.from('chat-media').upload(fileName,blob);
    if(!error){
      const {data:pub}=supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
      await supabaseClient.from('messages').insert({sender:currentUser,type:'voice',audio_url:pub.publicUrl});
      return;
    }
  }catch(e){}
  // fallback base64
  const reader=new FileReader();
  reader.onload=async()=>{
    await supabaseClient.from('messages').insert({sender:currentUser,type:'voice',audio_url:reader.result});
  };
  reader.readAsDataURL(blob);
}

// IMAGE - FIXED
async function handleImage(e){
  const file=e.target.files[0]; if(!file) return;
  if(file.size>6*1024*1024){ alert('الصورة كبيرة، أقل من 6 ميجا'); return; }
  try{
    const fileName=`img_${Date.now()}_${file.name.replace(/[^a-z0-9.]/gi,'_')}`;
    const {error}=await supabaseClient.storage.from('chat-media').upload(fileName,file);
    if(!error){
      const {data:pub}=supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
      await supabaseClient.from('messages').insert({sender:currentUser,type:'image',image_url:pub.publicUrl});
      e.target.value=''; return;
    }
  }catch(err){}
  // fallback base64 لو الستوريج مش معمول
  const reader=new FileReader();
  reader.onload=async()=>{
    await supabaseClient.from('messages').insert({sender:currentUser,type:'image',image_url:reader.result});
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

// CALL - FIXED REAL AUDIO
async function createPeer(isCaller){
  peerConn=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  peerConn.onicecandidate=e=>{ if(e.candidate && channel){ channel.send({type:'broadcast',event:'call_ice',payload:{candidate:e.candidate,from:currentUser}}); } };
  peerConn.ontrack=e=>{ const audio=document.getElementById('remoteAudio'); if(audio){ audio.srcObject=e.streams[0]; } document.getElementById('callStatus').textContent='متصل ❤️'; startCallTimer(); };
  if(localStream){ localStream.getTracks().forEach(track=>peerConn.addTrack(track,localStream)); }
}
function startCallTimer(){ callSeconds=0; callTimerInt=setInterval(()=>{ callSeconds++; const m=String(Math.floor(callSeconds/60)).padStart(2,'0'); const s=String(callSeconds%60).padStart(2,'0'); const el=document.getElementById('callTimer'); if(el) el.textContent=`${m}:${s}`; },1000); }
function stopCallTimer(){ clearInterval(callTimerInt); const el=document.getElementById('callTimer'); if(el) el.textContent='00:00'; }

window.startCall=async()=>{
  document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callScreen').classList.add('flex');
  document.getElementById('callName').textContent=currentUser==='السيد'?'روان':'السيد';
  document.getElementById('callStatus').textContent='جاري الاتصال...';
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true});
    await createPeer(true);
    const offer=await peerConn.createOffer(); await peerConn.setLocalDescription(offer);
    if(channel) channel.send({type:'broadcast',event:'call_offer',payload:{offer,from:currentUser}});
  }catch(e){ document.getElementById('callStatus').textContent='الميكروفون مقفول - اسمح للميكروفون'; }
};
window.endCall=()=>{
  document.getElementById('callScreen').classList.add('hidden'); document.getElementById('callScreen').classList.remove('flex');
  document.getElementById('incomingCall').classList.add('hidden'); document.getElementById('incomingCall').classList.remove('flex');
  if(localStream) localStream.getTracks().forEach(t=>t.stop()); localStream=null;
  if(peerConn){ peerConn.close(); peerConn=null; }
  stopCallTimer(); if(window._ring){ window._ring.pause(); window._ring=null; }
  if(channel) channel.send({type:'broadcast',event:'call_end',payload:{from:currentUser}});
};
window.toggleMute=()=>{ if(localStream){ const t=localStream.getAudioTracks()[0]; if(t){ t.enabled=!t.enabled; document.getElementById('muteBtn').textContent=t.enabled?'🎤':'🔇'; } } };
window.toggleSpeaker=()=>{ alert('الصوت شغال من السماعة العادية، دوس على 🔊 في موبايلك'); };
async function showIncoming(from, offer){
  window._incomingOffer=offer; window._incomingFrom=from;
  document.getElementById('incomingCall').classList.remove('hidden'); document.getElementById('incomingCall').classList.add('flex');
  document.getElementById('incomingName').textContent=from+' يتصل... 📞';
  try{ const a=new Audio('https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=phone-ringing-101957.mp3'); a.loop=true; a.play(); window._ring=a; }catch(e){}
}
window.acceptCall=async()=>{
  if(window._ring){ window._ring.pause(); }
  document.getElementById('incomingCall').classList.add('hidden'); document.getElementById('callScreen').classList.remove('hidden'); document.getElementById('callScreen').classList.add('flex');
  document.getElementById('callName').textContent=window._incomingFrom||'حبيبك';
  document.getElementById('callStatus').textContent='جاري الرد...';
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true});
    await createPeer(false);
    await peerConn.setRemoteDescription(new RTCSessionDescription(window._incomingOffer));
    const answer=await peerConn.createAnswer(); await peerConn.setLocalDescription(answer);
    if(channel) channel.send({type:'broadcast',event:'call_answer',payload:{answer,from:currentUser}});
  }catch(e){ document.getElementById('callStatus').textContent='خطأ: '+e.message; }
};
window.declineCall=()=>{ if(window._ring){ window._ring.pause(); } document.getElementById('incomingCall').classList.add('hidden'); if(channel) channel.send({type:'broadcast',event:'call_end',payload:{from:currentUser}}); };

 .on('broadcast',{event:'music_sync'},({payload})=>{ if(payload.from!==currentUser){ document.getElementById('musicPlayer')?.classList.remove('hidden'); document.getElementById('nowPlaying').textContent=`${payload.from} مشغل أغنية ❤️`; document.getElementById('ytContainer').innerHTML=`<iframe class="w-full h-[220px]" src="https://www.youtube.com/embed/${payload.id}?autoplay=1&playsinline=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; openGames(); showGame('music'); } })
 .on('broadcast',{event:'call_offer'},async({payload})=>{ if(payload.from!==currentUser) await showIncoming(payload.from, payload.offer); })
 .on('broadcast',{event:'call_answer'},async({payload})=>{ if(payload.from!==currentUser && peerConn){ await peerConn.setRemoteDescription(new RTCSessionDescription(payload.answer)); document.getElementById('callStatus').textContent='متصل ❤️'; startCallTimer(); } })

 .subscribe();
}
