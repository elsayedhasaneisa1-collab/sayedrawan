<div id="gamesHub" class="fixed inset-0 z-50 bg-[#070710]/95 backdrop-blur-xl hidden overflow-y-auto">

    <div id="game-mood" class="gamePanel"><div class="glass rounded-[24px] p-6"><h3 class="font-bold mb-4">مزاجك ايه؟</h3><div class="grid grid-cols-3 gap-3">

<script>
const SUPABASE_URL = 'https://szuvpbdwixezecxnykjn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NgBzisUuNn6Gdz9PE1XgWg_EYlC5zta';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser=localStorage.getItem('sr-current'); let messages=[]; let channel=null;
let xoBoard=["","","","","","","","",""];
let musicList=JSON.parse(localStorage.getItem('sr-music')||'[]');
let moods=JSON.parse(localStorage.getItem('sr-moods')||'{}');

function login(){
  document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-5"><div class="w-full max-w-[360px] text-center"><div class="w-20 h-20 mx-auto glass rounded-full flex items-center justify-center text-3xl">❤️</div><h1 class="text-[28px] font-extrabold mt-4">السيد & روان</h1><p class="text-white/30 text-[10px]">GitHub Version V6 - يعمل 100% على جيتهب</p><div class="glass rounded-[28px] p-7 mt-6 text-right"><select id="u" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-sm"><option value="السيد">السيد 👑</option><option value="روان">روان 👸</option></select><input id="p" type="password" placeholder="كلمة المرور" class="w-full mt-4 bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-sm"><div class="text-[10px] text-white/30 mt-3">السيد: sayed123 | روان: rawan123</div><button id="loginBtn" class="w-full mt-6 py-3.5 rounded-full bg-gradient-to-br from-pink-500 to-violet-600 font-bold text-sm">دخول 🎮</button></div></div></div>`;
  document.getElementById('loginBtn').onclick=()=>{
    const u=document.getElementById('u').value; const p=document.getElementById('p').value;
    const expected=u==='السيد'?'sayed123':'rawan123';
    if(p!==expected){ alert('الباسوورد غلط'); return; }
    currentUser=u; localStorage.setItem('sr-current',u); init();
  };
}
function main(){
  document.getElementById('app').innerHTML=`<div class="flex flex-col h-screen max-w-[780px] mx-auto w-full"><div class="glass border-b border-white/10 px-4 py-3 flex items-center justify-between"><div class="font-bold text-[13px]">السيد & روان ❤️ V6</div><div class="flex gap-2"><button onclick="document.getElementById('gamesHub').classList.remove('hidden')" class="px-3 py-1.5 rounded-full bg-gradient-to-br from-pink-500 to-violet-600 text-[11px] font-bold">🎮 ألعاب</button><button onclick="localStorage.removeItem('sr-current');location.reload()" class="w-8 h-8 rounded-full bg-white/10">↩️</button></div></div><div id="moodBar" class="px-4 py-2 bg-white/[0.03] text-[11px] flex justify-between"><span id="myMoodBar"></span><span id="partnerMoodBar" class="text-pink-300"></span></div><div id="list" class="flex-1 overflow-y-auto px-3 py-4 space-y-2"></div><div class="glass border-t border-white/10 p-3"><div class="flex gap-2"><div class="flex-1 relative"><textarea id="inp" rows="1" placeholder="رسالة..." class="w-full bg-white/5 border border-white/10 rounded-[20px] px-4 py-3 text-[13px] resize-none outline-none"></textarea><button id="send" class="absolute left-1.5 bottom-1.5 w-8 h-8 rounded-full bg-gradient-to-br from-pink-500 to-violet-600">➤</button></div><button onclick="document.getElementById('gamesHub').classList.remove('hidden')" class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-violet-600">🎮</button></div></div></div>`;
  const inp=document.getElementById('inp'); inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendText(); }}); document.getElementById('send').onclick=sendText; renderMsgs();
}
function renderMsgs(){ const list=document.getElementById('list'); if(!list) return; list.innerHTML=messages.map(m=>{ const isMe=m.sender===currentUser; let body=m.type==='game'?`<div class="bg-white/10 rounded-xl p-2 text-xs">🎮 ${m.text}</div>`:`<div>${m.text}</div>`; return `<div class="flex ${isMe?'justify-end':'justify-start'}"><div class="max-w-[76%]"><div class="text-[9px] text-white/30">${m.sender}</div><div class="bg-gradient-to-br ${isMe?'from-violet-600 to-indigo-600':'from-pink-500 to-rose-500'} rounded-[18px] px-3.5 py-2.5 text-[13px]">${body}</div></div></div>`; }).join('')+`<div id="btm"></div>`; document.getElementById('btm')?.scrollIntoView(); }
async function sendText(){ const inp=document.getElementById('inp'); let t=inp.value.trim(); if(!t) return; inp.value=''; messages.push({sender:currentUser,text:t,created_at:new Date().toISOString(),id:'tmp'}); renderMsgs(); await supabaseClient.from('messages').insert({sender:currentUser,text:t,type:'text'}); }

window.closeGames=()=>{ document.getElementById('gamesHub').classList.add('hidden'); };
window.showGame=(id)=>{ document.querySelectorAll('.gamePanel').forEach(p=>p.classList.add('hidden')); document.getElementById('game-'+id).classList.remove('hidden'); };
const sarahahQs=["ايه أكتر حاجة بتحبها فيا؟","امتى أول مرة حسيت انك بتحبني؟","لو هنسافر فين؟","ايه أكتر لحظة رومانسية؟","بتفكر فيا كام مرة؟"]; let currentQ=""; window.nextSarahah=()=>{ currentQ=sarahahQs[Math.floor(Math.random()*sarahahQs.length)]; document.getElementById('sarahahCard').textContent=currentQ; }; window.sendSarahahAns=()=>{ if(!currentQ) return; const ans=prompt(currentQ); if(ans) supabaseClient.from('messages').insert({sender:currentUser,text:`🔥 صراحة: ${currentQ} - ${ans}`,type:'game'}); }; window.nextSarahah();
function drawXO(){ const b=document.getElementById('xoBoard'); if(!b) return; b.innerHTML=xoBoard.map((v,i)=>`<button onclick="playXO(${i})" class="aspect-square bg-white/5 rounded-xl flex items-center justify-center text-2xl font-bold">${v}</button>`).join(''); } window.playXO=(i)=>{ if(xoBoard[i]) return; xoBoard[i]=xoBoard.filter(x=>x).length%2===0?'X':'O'; drawXO(); }; window.resetXO=()=>{ xoBoard=["","","","","","","","",""]; drawXO(); }; drawXO();
const challenges=["ابعت فويس بحبك","ابعت صورة مضحكة","غني مقطع","قول 3 حاجات بتحبها فيا"]; window.spinWheel=()=>{ const chal=challenges[Math.floor(Math.random()*challenges.length)]; document.getElementById('challengeText').textContent=chal; document.getElementById('challengeResult').classList.remove('hidden'); window._last=chal; }; window.sendChallenge=()=>{ if(window._last) supabaseClient.from('messages').insert({sender:currentUser,text:`🎡 تحدي: ${window._last}`,type:'game'}); };
function renderMusic(){ const el=document.getElementById('musicList'); if(!el) return; el.innerHTML=musicList.map((m,i)=>`<div class="flex justify-between p-3 rounded-xl bg-white/5 text-xs"><span>${m.title}</span><button onclick="playMusic(${i})" class="px-3 py-1 rounded-full bg-white text-black">▶️</button></div>`).join(''); } window.addMusic=()=>{ const link=document.getElementById('musicLink').value.trim(); if(!link) return; let id=''; const mm=link.match(/(?:v=|youtu.be\/)([^&]+)/); if(mm) id=mm[1]; musicList.push({title:id||link,link,id,addedBy:currentUser}); localStorage.setItem('sr-music',JSON.stringify(musicList)); renderMusic(); }; window.playMusic=(i)=>{ const m=musicList[i]; document.getElementById('musicPlayer').classList.remove('hidden'); document.getElementById('nowPlaying').textContent=m.title; if(m.id) document.getElementById('ytFrame').src=`https://www.youtube.com/embed/${m.id}?autoplay=1`; }; renderMusic();
window.setMood=(emoji,label)=>{ moods[currentUser]={emoji,label}; localStorage.setItem('sr-moods',JSON.stringify(moods)); document.getElementById('myMood').textContent=emoji+' '+label; document.getElementById('myMoodBar').textContent=`مزاجك: ${emoji} ${label}`; if(channel) channel.send({type:'broadcast',event:'mood',payload:{user:currentUser,emoji,label}}); };

async function init(){
  if(!currentUser){ login(); return; }
  const {data,error}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:true}).limit(200);
  if(error){ document.getElementById('app').innerHTML=`<div class="p-6 text-xs">خطأ: ${error.message}<br><br>اعمل SQL ده:<br><pre class="bg-black/50 p-2 rounded mt-2">alter table public.messages add column if not exists type text default 'text';</pre></div>`; return; }
  messages=data||[]; main();
  channel=supabaseClient.channel('main');
  channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{ messages.push(p.new); renderMsgs(); }).on('broadcast',{event:'mood'},({payload})=>{ if(payload.user!==currentUser){ const el=document.getElementById('partnerMood'); if(el) el.textContent=payload.emoji+' '+payload.label; }}).subscribe();
}
init();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
